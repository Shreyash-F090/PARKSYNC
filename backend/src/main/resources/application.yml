server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  forward-headers-strategy: framework

spring:
  application:
    name: parksync
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:parksync}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:parksync}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

parksync:
  jwt:
    secret: ${APP_JWT_SECRET:${SESSION_SECRET}}
    lifetime: PT2H
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    name: ${ADMIN_NAME:PARKSYNC Administrator}

management:
  endpoints:
    web:
      exposure:
        include: health